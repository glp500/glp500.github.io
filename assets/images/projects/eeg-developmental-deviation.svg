    <g fill="#9db7be"><circle cx="85" cy="320" r="9"/><circle cx="145" cy="298" r="9"/><circle cx="205" cy="324" r="9"/><circle cx="265" cy="303" r="9"/><circle cx="325" cy="320" r="9"/></g>
  </g>
  <path d="M550 340h100" stroke="#f0fd71" stroke-width="7"/><path d="m625 315 25 25-25 25" fill="none" stroke="#f0fd71" stroke-width="7"/>
  <text x="90" y="610" fill="#f4f1e7" font-family="Georgia" font-size="27">Aggregate cohort N = 1,318 · participant-level data not shown</text>
</svg>
