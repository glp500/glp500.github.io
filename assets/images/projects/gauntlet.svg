  <title>Gauntlet local analysis workflow</title>
  <rect width="1200" height="700" fill="#9db7be"/>
  <g fill="none" stroke="#0b1113" stroke-width="3">
    <rect x="70" y="210" width="190" height="210"/><rect x="355" y="145" width="220" height="340"/>
    <rect x="670" y="145" width="220" height="340"/><rect x="985" y="210" width="145" height="210"/>
    <path d="M260 315h95m220 0h95m220 0h95"/><path d="m337 300 18 15-18 15m315-30 18 15-18 15m315-30 18 15-18 15"/>
  </g>
  <g fill="#0b1113" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="165" y="278" font-size="24">TASK + CSV</text><text x="165" y="320" font-size="16">local inputs</text>
    <text x="465" y="245" font-size="24">GENERATE</text><text x="465" y="286" font-size="16">inspectable bundle</text>
