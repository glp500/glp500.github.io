{% if include.social and include.social.size > 0 %}
  <nav class="social-links" aria-label="External profiles">
    {% for item in include.social %}
      {% if item.url and item.url != "" %}
        <a href="{{ item.url }}" target="_blank" rel="me noreferrer">{{ item.label }} ↗</a>
      {% endif %}
    {% endfor %}
  </nav>
{% endif %}
