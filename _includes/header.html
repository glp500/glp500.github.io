{% assign profile = site.data.profile %}
<header class="site-header" data-site-header>
  <div class="site-header__inner">
    <a class="site-header__brand" href="{{ '/' | relative_url }}" data-world-link="home">
      <span class="site-header__name">{{ profile.name }}</span>
      <span class="site-header__discipline">{{ profile.title }}</span>
    </a>

    <button class="site-header__toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span data-menu-label>Menu</span>
      <span class="site-header__toggle-mark" aria-hidden="true"></span>
    </button>

    <nav class="site-nav" id="site-nav" data-site-nav aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        {% assign is_active = false %}
        {% if page.nav_key == item.key %}
          {% assign is_active = true %}
        {% endif %}
        <a
          class="site-nav__link{% if is_active %} is-active{% endif %}"
          href="{{ item.url | relative_url }}"
          data-world-link="{{ item.world_mode }}"
          {% if is_active %}aria-current="page"{% endif %}
        >{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
