{% assign profile = site.data.profile %}
<footer class="site-footer" id="contact" data-world-mode="home">
  <div class="site-footer__inner shell">
    <h2>Contact</h2>
    <div class="site-footer__contact">
      <a href="mailto:{{ profile.contact.email }}">{{ profile.contact.email }} ↗</a>
      <span>{{ profile.contact.location }}</span>
      {% include social-links.html social=profile.contact.social %}
    </div>
    <p class="site-footer__copy">© {{ site.time | date: "%Y" }} {{ profile.name }}</p>
  </div>
</footer>
