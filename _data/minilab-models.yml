# Curated models for the Mini-Lab.
#
# Sizes are the real byte sizes reported by the Hugging Face API, not estimates.
# `min_budget_gb` is the memory the model needs once loaded (weights plus KV
# cache and runtime overhead), which is always more than the download size.
#
# The browser cannot load a single file larger than 2 GB (ArrayBuffer limit).
# Models above that are listed with `blocked_reason` so the picker can explain
# why they are unavailable rather than silently hiding them.

