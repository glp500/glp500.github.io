name: Gavin
title: "Researcher, builder, and student of complex systems"
tagline: "Research · Systems · Culture"
summary: "I study how intelligence, coordination, and culture emerge from many interacting parts—and build tools for institutions navigating that complexity."
bio: "My work moves between computational research, institutional technology, and the longer histories of how people organize knowledge. I am especially drawn to questions that resist a single disciplinary lens: how groups learn, how feedback reshapes behavior, and how technical systems become cultural systems."
