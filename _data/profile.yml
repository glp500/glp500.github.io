name: Gavin Lip
title: "Information Retrieval, Computational Social Sciences and Cultural AI"
summary: "I study how coordination emerges between people, machines and the institutions they build, and where computational models of it clarify the thing or obscure it."
bio: "I build computational models, put multimodal data together, and try to leave the result inspectable by someone who did not write it. Most of the work has happened in labs and archives rather than products, and most of it is open source."

