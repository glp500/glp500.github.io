title: Gavin Lip
email: "lip.gavin@gmail.com"
description: Research and projects in cybernetic systems, cultural AI, informatics, and computational history.
url: "https://glp500.github.io"
baseurl: ""
lang: en
timezone: Europe/Amsterdam
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  research:
    output: true
    permalink: /research/:name/
  projects:
    output: true
    permalink: /projects/:name/
  publications:
    output: true
    permalink: /publications/:name/
  media:
    output: false
  resources:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      world_mode: notes
  - scope:
      path: ""
      type: research
    values:
      layout: research-detail
      world_mode: research
  - scope:
      path: ""
      type: projects
    values:
      layout: project-detail
      world_mode: projects
  - scope:
      path: ""
      type: publications
    values:
      layout: publication-detail
      world_mode: publications
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.MD
  - content-templates
  - vendor
