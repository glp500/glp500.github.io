title: Gavin Lip
email: "lip.gavin@gmail.com"
description: Information retrieval, computational social sciences and cultural AI, with the code behind it.
url: "https://glp500.github.io"
baseurl: ""
lang: en
timezone: Europe/Amsterdam
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:name/
  publications:
    output: true
    permalink: /publications/:name/
  media:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project-detail
  - scope:
      path: ""
      type: publications
    values:
      layout: publication-detail
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.MD
  - content-templates
  - vendor
  - test
  - "AI Researcher - Software Architect.svg" # 3.7 MB design source, not a site asset
  - gavin_photo.jpeg # portrait source; the cropped asset is assets/images/gavin-lip-portrait.webp
  - HANDOFF.md
  - tools
