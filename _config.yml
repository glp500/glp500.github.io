title: Gavin · Research & Practice
email: ""
description: Research, projects, and field notes on collective intelligence, cybernetics, computational history, and machine learning.
url: "https://glp500.github.io"
baseurl: ""
lang: en
timezone: Europe/Berlin
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: false
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.MD
  - content-templates
  - vendor
