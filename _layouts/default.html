<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body
    class="page-{{ page.nav_key | default: page.layout | default: 'default' | slugify }}"
    data-page="{{ page.nav_key | default: page.layout | default: 'default' | slugify }}"
  >
    <a class="skip-link" href="#main-content">Skip to content</a>
    <canvas class="bird-sky" data-bird-sky aria-hidden="true"></canvas>

    {% unless page.nav_key == 'home' %}
      <a class="back-home" href="{{ '/' | relative_url }}">Back to Home</a>
    {% endunless %}

    <main id="main-content">
      {{ content }}
    </main>

    {% unless page.nav_key == 'home' %}
      {% include footer.html %}
    {% endunless %}

    {% assign asset_version = site.time | date: "%Y%m%d%H%M%S" %}
    <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ asset_version }}" defer></script>
  </body>
</html>
